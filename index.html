<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found BD 24 - আয়ের নির্ভরযোগ্য প্ল্যাটফর্ম</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #0c0f1d;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .neon-card {
            background: linear-gradient(145deg, #161a2e, #111425);
            border: 1px solid rgba(139, 92, 246, 0.18);
        }
        .glow-purple {
            box-shadow: 0 4px 20px -2px rgba(147, 51, 234, 0.35);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20 select-none">

    <!-- Custom In-App Modal / Notification Popup -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
        <div class="bg-[#171a2e] border border-purple-500/40 rounded-3xl p-5 w-full max-w-sm text-center shadow-2xl relative transform transition-all scale-95 duration-200" id="modalBox">
            <div id="modalIconWrap" class="w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl"></div>
            <h3 id="modalTitle" class="text-base font-bold text-white mb-1"></h3>
            <p id="modalDesc" class="text-xs text-gray-300 mb-5 leading-relaxed"></p>
            <button onclick="closeModal()" id="modalBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs shadow-lg">ঠিক আছে</button>
        </div>
    </div>

    <!-- Registration ৳200 Bonus Popup Modal -->
    <div id="bonusModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="bg-gradient-to-b from-[#1e1b4b] to-[#0f172a] border-2 border-amber-400/60 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl relative animate-pulse">
            <div class="w-20 h-20 bg-amber-500/20 border border-amber-400 rounded-full mx-auto mb-3 flex items-center justify-center text-4xl text-amber-300">
                🎁
            </div>
            <span class="bg-amber-400/20 text-amber-300 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">অভিনন্দন বোনাস</span>
            <h2 class="text-xl font-bold text-white mt-2">৳২০০ রেজিস্ট্রেশন বোনাস!</h2>
            <p class="text-xs text-gray-300 mt-1 mb-4">Found BD 24 পরিবারে স্বাগতম! আপনার মূল ব্যালেন্সে ২০০ টাকা যুক্ত করা হয়েছে।</p>
            <button onclick="document.getElementById('bonusModal').classList.add('hidden')" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-black font-bold py-3 rounded-xl text-xs shadow-lg">বোনাস সংগ্রহ করুন</button>
        </div>
    </div>

    <!-- Floating Live Customer Support Chat Button -->
    <div class="fixed right-4 bottom-20 z-40">
        <button onclick="toggleSupportChat()" class="w-14 h-14 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white flex items-center justify-center shadow-2xl glow-purple hover:scale-105 transition transform">
            <i class="fa-solid fa-headset text-2xl"></i>
            <span id="unreadChatBadge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden">1</span>
        </button>
    </div>

    <!-- Live Customer Support Chat Window -->
    <div id="supportChatModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-2 sm:p-4 bg-black/60 backdrop-blur-sm hidden">
        <div class="bg-[#151829] border border-purple-500/30 rounded-3xl w-full max-w-md h-[520px] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-purple-800 to-indigo-900 px-4 py-3 flex justify-between items-center text-white">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-headset"></i></div>
                    <div>
                        <h4 class="text-xs font-bold">২৪/৭ কাস্টমার সাপোর্ট</h4>
                        <p class="text-[9px] text-emerald-300">অনলাইন প্রতিনিধি উপলব্ধ</p>
                    </div>
                </div>
                <button onclick="toggleSupportChat()" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <!-- User Pre-filled Info -->
            <div class="bg-black/30 px-4 py-2 border-b border-white/5 text-[11px] text-gray-300 flex justify-between">
                <span>ইউজার: <strong id="chatUserName" class="text-purple-300">গেস্ট</strong></span>
                <span>ফোন: <strong id="chatUserPhone" class="text-purple-300">N/A</strong></span>
            </div>
            <!-- Messages List -->
            <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-2 text-xs"></div>
            <!-- Input Bar -->
            <div class="p-3 bg-black/40 border-t border-white/10 flex gap-2">
                <input id="chatInputText" type="text" placeholder="আপনার সমস্যা বা বার্তা লিখুন..." class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                <button onclick="sendUserMessage()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 rounded-xl text-xs font-bold"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- App Header -->
    <header class="bg-[#111425] sticky top-0 z-30 border-b border-gray-800/80 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2.5">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-pink-500 flex items-center justify-center shadow-md">
                <i class="fa-solid fa-wallet text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-base tracking-wide bg-gradient-to-r from-purple-400 via-pink-400 to-indigo-300 bg-clip-text text-transparent">Found BD 24</h1>
                <p class="text-[9px] text-emerald-400 font-medium flex items-center">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block mr-1 animate-ping"></span> বাংলাদেশের বিশ্বস্ত ইনকাম সাইট
                </p>
            </div>
        </div>
        <div id="authHeaderAction"></div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-5" id="mainApp">
        <!-- Dynamic Content Injected Here via switchTab() -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#111424] border-t border-gray-800/80 py-2.5 px-3 flex justify-around items-center z-30 max-w-md mx-auto shadow-2xl">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-purple-400 transition">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] mt-1 font-medium">ড্যাশবোর্ড</span>
        </button>
        <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center text-gray-400 hover:text-purple-400 transition">
            <i class="fa-solid fa-circle-play text-base"></i>
            <span class="text-[10px] mt-1 font-medium">কাজ</span>
        </button>
        <button onclick="switchTab('plans')" id="nav-plans" class="flex flex-col items-center text-gray-400 hover:text-purple-400 transition">
            <i class="fa-solid fa-gem text-base"></i>
            <span class="text-[10px] mt-1 font-medium">প্ল্যান</span>
        </button>
        <button onclick="switchTab('withdraw')" id="nav-withdraw" class="flex flex-col items-center text-gray-400 hover:text-purple-400 transition">
            <i class="fa-solid fa-money-bill-transfer text-base"></i>
            <span class="text-[10px] mt-1 font-medium">উইথড্র</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400 hover:text-purple-400 transition">
            <i class="fa-solid fa-user-circle text-base"></i>
            <span class="text-[10px] mt-1 font-medium">প্রোফাইল</span>
        </button>
    </nav>

    <script>
        // Database Initialization with LocalStorage
        const DB_KEY = 'foundbd24_database';
        const DEFAULT_DB = {
            settings: {
                minWithdraw: 300,
                verificationFee: 1440,
                referralRate: 7, // 7%
                adminNumbers: {
                    bkash: "01851634039",
                    nagad: "01851634039",
                    rocket: "01851634039",
                    upay: "01851634039"
                },
                verificationVideoUrl: "https://youtu.be/bP1MW4UpbRI?si=ebR1GPr987wub4X5",
                dailyTaskUrl: "https://youtu.be/bP1MW4UpbRI?si=ebR1GPr987wub4X5"
            },
            packages: [
                { id: 1, name: "প্ল্যান ১", price: 500, daily: 300, totalAds: 3, validity: 30 },
                { id: 2, name: "প্ল্যান ২", price: 1000, daily: 600, totalAds: 6, validity: 30 },
                { id: 3, name: "প্ল্যান ৩", price: 1500, daily: 900, totalAds: 9, validity: 30 },
                { id: 4, name: "প্ল্যান ৪", price: 2500, daily: 1600, totalAds: 16, validity: 30 },
                { id: 5, name: "প্ল্যান ৫", price: 5000, daily: 3500, totalAds: 35, validity: 30 }
            ],
            users: [],
            requests: [], // deposit, withdraw, verification
            messages: []  // chat
        };

        function getDB() {
            const raw = localStorage.getItem(DB_KEY);
            return raw ? JSON.parse(raw) : DEFAULT_DB;
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        let currentUser = null;
        let activeTab = 'dashboard';

        function checkAuth() {
            const storedPhone = localStorage.getItem('foundbd24_logged_user');
            const db = getDB();
            if (storedPhone) {
                currentUser = db.users.find(u => u.phone === storedPhone) || null;
            }
        }

        // Custom Modal UI helper
        function showModal(title, desc, type = 'info', onOk = null) {
            const wrap = document.getElementById('modalIconWrap');
            const box = document.getElementById('modalBox');
            if(type === 'success') {
                wrap.className = 'w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                wrap.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else if(type === 'error') {
                wrap.className = 'w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl bg-rose-500/20 text-rose-400 border border-rose-500/30';
                wrap.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                wrap.className = 'w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl bg-purple-500/20 text-purple-400 border border-purple-500/30';
                wrap.innerHTML = '<i class="fa-solid fa-bell"></i>';
            }
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalBtn').onclick = () => {
                closeModal();
                if(onOk) onOk();
            };
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        // Tab Navigation
        function switchTab(tab) {
            activeTab = tab;
            ['dashboard', 'tasks', 'plans', 'withdraw', 'profile'].forEach(t => {
                const nav = document.getElementById(`nav-${t}`);
                if(nav) {
                    nav.className = (t === tab) ? 
                        'flex flex-col items-center text-purple-400 transition' : 
                        'flex flex-col items-center text-gray-400 hover:text-purple-400 transition';
                }
            });
            renderView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // View Rendering Engine
        function renderView() {
            const main = document.getElementById('mainApp');
            const authAction = document.getElementById('authHeaderAction');
            const db = getDB();

            if (!currentUser) {
                authAction.innerHTML = `
                    <button onclick="renderLogin()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-3 py-1.5 rounded-xl font-semibold shadow-md">লগইন</button>
                `;
                renderRegisterOrLogin();
                return;
            }

            authAction.innerHTML = `
                <div class="flex items-center space-x-2">
                    <span class="bg-purple-950/70 border border-purple-500/30 text-purple-300 text-xs px-2.5 py-1 rounded-xl font-bold">
                        ৳${currentUser.balance.toFixed(2)}
                    </span>
                    <button onclick="logout()" class="text-gray-400 hover:text-rose-400 text-sm p-1.5"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            `;

            // Update chat user details
            document.getElementById('chatUserName').innerText = currentUser.name;
            document.getElementById('chatUserPhone').innerText = currentUser.phone;

            if (activeTab === 'dashboard') renderDashboardView(db);
            else if (activeTab === 'tasks') renderTasksView(db);
            else if (activeTab === 'plans') renderPlansView(db);
            else if (activeTab === 'withdraw') renderWithdrawView(db);
            else if (activeTab === 'profile') renderProfileView(db);
            else if (activeTab === 'deposit') renderDepositView(db);
            else if (activeTab === 'verification') renderVerificationView(db);
        }

        // ================= AUTH (REGISTER / LOGIN) =================
        function renderRegisterOrLogin(isLogin = false) {
            const urlParams = new URLSearchParams(window.location.search);
            const refFromUrl = urlParams.get('ref') || '';
            const main = document.getElementById('mainApp');

            if(isLogin) {
                main.innerHTML = `
                    <div class="neon-card p-6 rounded-3xl space-y-5 shadow-2xl">
                        <div class="text-center">
                            <h2 class="text-2xl font-bold text-white">স্বাগতম</h2>
                            <p class="text-xs text-gray-400 mt-1">আপনার অ্যাকাউন্টে লগইন করে আয়ের যাত্রা চালিয়ে যান</p>
                        </div>
                        <div class="space-y-3.5">
                            <div>
                                <label class="text-xs text-gray-300 block mb-1.5 font-medium">মোবাইল নাম্বার</label>
                                <input id="loginPhone" type="text" placeholder="01XXXXXXXXX" class="w-full bg-black/40 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <div>
                                <label class="text-xs text-gray-300 block mb-1.5 font-medium">পাসওয়ার্ড</label>
                                <input id="loginPass" type="password" placeholder="আপনার পাসওয়ার্ড লিখুন" class="w-full bg-black/40 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-xl text-xs shadow-lg glow-purple mt-2">লগইন করুন</button>
                            <p class="text-center text-xs text-gray-400 mt-3">
                                নতুন ব্যবহারকারী? <button onclick="renderRegisterOrLogin(false)" class="text-purple-400 font-bold underline">অ্যাকাউন্ট তৈরি করুন</button>
                            </p>
                        </div>
                    </div>
                `;
            } else {
                main.innerHTML = `
                    <div class="neon-card p-6 rounded-3xl space-y-5 shadow-2xl">
                        <div class="text-center">
                            <h2 class="text-2xl font-bold text-white">যুক্ত হোন</h2>
                            <p class="text-xs text-gray-400 mt-1">ফ্রি সাইন আপ করুন এবং আজই আয় শুরু করুন</p>
                        </div>
                        <div class="space-y-3.5">
                            <div>
                                <label class="text-xs text-gray-300 block mb-1 font-medium">পূর্ণ নাম</label>
                                <input id="regName" type="text" placeholder="আপনার নাম লিখুন" class="w-full bg-black/40 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <div>
                                <label class="text-xs text-gray-300 block mb-1 font-medium">মোবাইল নাম্বার</label>
                                <input id="regPhone" type="text" placeholder="01XXXXXXXXX" class="w-full bg-black/40 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <div>
                                <label class="text-xs text-gray-300 block mb-1 font-medium">পাসওয়ার্ড</label>
                                <input id="regPass" type="password" placeholder="নতুন পাসওয়ার্ড দিন" class="w-full bg-black/40 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <div>
                                <label class="text-xs text-gray-300 block mb-1 font-medium">রেফারেল কোড (ঐচ্ছিক)</label>
                                <input id="regRef" type="text" value="${refFromUrl}" placeholder="রেফার কোড থাকলে দিন" class="w-full bg-black/40 border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-purple-300 focus:outline-none focus:border-purple-500 font-mono">
                            </div>
                            <div class="p-2.5 rounded-xl bg-purple-950/40 border border-purple-500/30 text-center">
                                <p class="text-[11px] text-emerald-400 font-bold">✨ একাউন্ট খুললেই ৳২০০ বোনাস মূল ব্যালেন্সে যোগ হবে</p>
                            </div>
                            <button onclick="handleRegister()" class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 text-white font-bold py-3 rounded-xl text-xs shadow-lg glow-purple">অ্যাকাউন্ট তৈরি করুন</button>
                            <p class="text-center text-xs text-gray-400 mt-3">
                                ইতিমধ্যে একাউন্ট আছে? <button onclick="renderRegisterOrLogin(true)" class="text-purple-400 font-bold underline">লগইন করুন</button>
                            </p>
                        </div>
                    </div>
                `;
            }
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const refCode = document.getElementById('regRef').value.trim().toUpperCase();

            if (!name || !phone || !pass) {
                showModal('তথ্য অসম্পূর্ণ', 'অনুগ্রহ করে নাম, মোবাইল নম্বর এবং পাসওয়ার্ড পূরণ করুন।', 'error');
                return;
            }
            if (!/^01\d{9}$/.test(phone)) {
                showModal('ভুল নম্বর', '১১ ডিজিটের সঠিক মোবাইল নম্বর দিন (যেমন: 017xxxxxxxx)।', 'error');
                return;
            }

            const db = getDB();
            if (db.users.some(u => u.phone === phone)) {
                showModal('নম্বর বিদ্যমান', 'এই ফোন নম্বরে ইতিমধ্যে একটি অ্যাকাউন্ট তৈরি করা হয়েছে। অনুগ্রহ করে লগইন করুন।', 'error');
                return;
            }

            // Create unique user referral code
            const userReferralCode = Math.random().toString(36).substring(2, 10).toUpperCase();

            const newUser = {
                id: Date.now(),
                name,
                phone,
                pass,
                balance: 200.00, // ৳200 Registration Bonus
                totalIncome: 200.00,
                todayIncome: 0.00,
                referralCode: userReferralCode,
                referredBy: refCode || null,
                activePackage: null,
                hasPurchasedPackage: false,
                verificationStatus: 'Unverified', // 'Unverified', 'Pending', 'Verified'
                createdAt: new Date().toLocaleDateString('bn-BD'),
                lastTaskDate: null
            };

            db.users.push(newUser);
            saveDB(db);

            currentUser = newUser;
            localStorage.setItem('foundbd24_logged_user', phone);

            // Trigger ৳200 Bonus Popup
            document.getElementById('bonusModal').classList.remove('hidden');
            renderView();
        }

        function handleLogin() {
            const phone = document.getElementById('loginPhone').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            const db = getDB();
            const user = db.users.find(u => u.phone === phone && u.pass === pass);

            if (!user) {
                showModal('লগইন ব্যর্থ', 'মোবাইল নম্বর অথবা পাসওয়ার্ড ভুল হয়েছে।', 'error');
                return;
            }

            currentUser = user;
            localStorage.setItem('foundbd24_logged_user', phone);

        function buyPlan(planId) {
            const db = getDB();
            const plan = db.packages.find(p => p.id === planId);
            if (!plan) return;

            if (currentUser.balance < plan.price) {
                showModal('অপর্যাপ্ত ব্যালেন্স', `আপনার অ্যাকাউন্টে পর্যাপ্ত টাকা নেই। এই প্ল্যান কিনতে ৳${plan.price} প্রয়োজন। দয়া করে আগে ডিপোজিট করুন।`, 'error', () => {
                    switchTab('deposit');
                });
                return;
            }

            // Deduct balance
            currentUser.balance -= plan.price;
            currentUser.activePackage = plan;
            currentUser.hasPurchasedPackage = true;

            // 7% Referral Commission to Referrer
            if (currentUser.referredBy) {
                const referrer = db.users.find(u => u.referralCode === currentUser.referredBy || u.phone === currentUser.referredBy);
                if (referrer) {
                    const commission = (plan.price * (db.settings.referralRate || 7)) / 100;
                    referrer.balance += commission;
                    referrer.totalIncome += commission;

                    // Push system message/notification to referrer
                    db.messages.push({
                        id: Date.now() + 1,
                        userPhone: referrer.phone,
                        sender: 'system',
                        text: `🎉 অভিনন্দন! আপনার রেফারেল করা মেম্বার (${currentUser.name}) ${plan.name} কিনেছেন। আপনার ব্যালেন্সে ৭% কমিশন হিসেবে ৳${commission.toFixed(2)} যোগ হয়েছে।`,
                        time: new Date().toLocaleTimeString('bn-BD', {hour: '2-digit', minute:'2-digit'})
                    });
                }
            }

            // Save user in DB
            const uIndex = db.users.findIndex(u => u.phone === currentUser.phone);
            if (uIndex !== -1) db.users[uIndex] = currentUser;
            saveDB(db);

            showModal('সফল!', `অভিনন্দন! আপনি সফলভাবে ${plan.name} ক্রয় করেছেন। প্রতিদিন কাজে গিয়ে টাস্ক সম্পন্ন করে আয় গ্রহণ করুন।`, 'success', () => {
                switchTab('tasks');
            });
        }

        function submitVerificationRequest() {

                showModal('তথ্য পূরণ করুন', 'অনুগ্রহ করে প্রেরক নম্বর এবং TrxID দিন।', 'error');
                return;
            }

            const db = getDB();
            const fee = db.settings.verificationFee || 1440;

            db.requests.push({
                id: Date.now(),
                type: 'Verification',
                userPhone: currentUser.phone,
                userName: currentUser.name,
                amount: fee,
                method,
                sender,
                trx,
                status: 'Pending',
                date: new Date().toLocaleDateString('bn-BD')
            });

            currentUser.verificationStatus = 'Pending';
            const uIndex = db.users.findIndex(u => u.phone === currentUser.phone);
            if (uIndex !== -1) db.users[uIndex] = currentUser;
            saveDB(db);

            showModal('আবেদন জমা হয়েছে', 'আপনার ভেরিফিকেশন ফি রিকোয়েস্ট অ্যাডমিন প্যানেলে পাঠানো হয়েছে। যাচাইয়ের পর ভেরিফাইড করা হবে।', 'success', () => {
                switchTab('profile');
            });

            main.innerHTML = `

                        </div>

        function setDepGateway(gw) {
            selectedDepGateway = gw;
            const db = getDB();
            ['bKash', 'Nagad', 'Rocket', 'Upay'].forEach(g => {
                const b = document.getElementById(`dep-btn-${g}`);
                if (b) {
                    b.className = (g === gw) ? 
                        'p-2.5 rounded-2xl border-2 border-purple-500 bg-purple-950/50 flex flex-col items-center' : 
                        'p-2.5 rounded-2xl border border-gray-800 bg-[#121528] flex flex-col items-center';
                }
            });
            document.getElementById('depGatewayTitle').innerText = gw === 'bKash' ? 'বিকাশ' : gw === 'Nagad' ? 'নগদ' : gw === 'Rocket' ? 'রকেট' : 'উপায়';

        function setDepAmount(amt) {
            document.getElementById('depAmount').value = amt;
        }

        function copyNumber() {
            const num = document.getElementById('depAdminNumber').innerText;
            navigator.clipboard.writeText(num);
            showModal('কপি সফল', `নম্বরটি (${num}) ক্লিপবোর্ডে কপি করা হয়েছে।`, 'info');
        }

        function submitDepositRequest() {
            const amount = parseFloat(document.getElementById('depAmount').value);
            const sender = document.getElementById('depSender').value.trim();
            const trx = document.getElementById('depTrx').value.trim();

            if (!amount || amount < 100 || !sender || !trx) {
                showModal('তথ্য ভুল', 'অনুগ্রহ করে সঠিক পরিমাণ (কমপক্ষে ১০০ টাকা), প্রেরক নম্বর ও TrxID দিন।', 'error');
                return;
            }

            const db = getDB();
            db.requests.push({
                id: Date.now(),
                type: 'Deposit',
                userPhone: currentUser.phone,
                userName: currentUser.name,
                amount,
                method: selectedDepGateway,
                sender,
                trx,
                status: 'Pending',
                date: new Date().toLocaleDateString('bn-BD')
            });
            saveDB(db);

            showModal('রিকোয়েস্ট সফল', 'আপনার ডিপোজিট আবেদনটি সফলভাবে জমা হয়েছে। অ্যাডমিন প্যানেল থেকে অনুমোদনের পর মূল ব্যালেন্সে টাকা যোগ হবে।', 'success', () => {
                switchTab('dashboard');
            });
        }

        // ================= WITHDRAW =================
        let selectedWthGateway = 'bKash';
        function renderWithdrawView(db) {
            const main = document.getElementById('mainApp');

                <div class="neon-card p-5 rounded-3xl space-y-4 shadow-xl">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                        <h3 class="text-sm font-bold text-white">টাকা উত্তোলন (Withdraw)</h3>
                        <span class="text-[10px] text-pink-400 font-bold bg-pink-500/20 px-2.5 py-0.5 rounded-full">দ্রুত পেমেন্ট</span>
                    </div>

                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setWthGateway('bKash')" id="wth-btn-bKash" class="p-2.5 rounded-2xl border-2 border-pink-500 bg-pink-950/40 flex flex-col items-center">
                            <span class="font-extrabold text-xs text-pink-400">bKash</span>
                        </button>
                        <button onclick="setWthGateway('Nagad')" id="wth-btn-Nagad" class="p-2.5 rounded-2xl border border-gray-800 bg-[#121528] flex flex-col items-center">
                            <span class="font-extrabold text-xs text-orange-400">Nagad</span>
                        </button>

                        </button>
                        <button onclick="setWthGateway('Upay')" id="wth-btn-Upay" class="p-2.5 rounded-2xl border border-gray-800 bg-[#121528] flex flex-col items-center">

                        </button>
                    </div>

                            <input id="wthAmount" type="number" placeholder="${minWth}" class="w-full bg-black/40 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
                        </div>
                        <div>
                            <label class="text-xs text-gray-300 block mb-1">আপনার পার্সোনাল মোবাইল নাম্বার</label>
                            <input id="wthNumber" type="text" placeholder="01XXXXXXXXX" class="w-full bg-black/40 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
                        </div>
                        <button onclick="submitWithdrawRequest()" class="w-full bg-gradient-to-r from-pink-600 to-rose-600 text-white font-bold py-3 rounded-xl text-xs shadow-lg glow-purple">উত্তোলনের আবেদন করুন</button>
                    </div>
                </div>
            `;
        }

        function setWthGateway(gw) {
            selectedWthGateway = gw;
            ['bKash', 'Nagad', 'Rocket', 'Upay'].forEach(g => {
                const b = document.getElementById(`wth-btn-${g}`);
                if (b) {
                    b.className = (g === gw) ? 
                        'p-2.5 rounded-2xl border-2 border-purple-500 bg-purple-950/50 flex flex-col items-center' : 
                        'p-2.5 rounded-2xl border border-gray-800 bg-[#121528] flex flex-col items-center';
                }
            });
        }

        function submitWithdrawRequest() {
            const db = getDB();
            const minWth = db.settings.minWithdraw || 300;
            const amount = parseFloat(document.getElementById('wthAmount').value);
            const number = document.getElementById('wthNumber').value.trim();

            if (!amount || amount < minWth) {
                showModal('ন্যূনতম উত্তোলন', `উত্তোলনের ন্যূনতম পরিমাণ ৳${minWth}।`, 'error');
                return;
            }
            if (currentUser.balance < amount) {
                showModal('ব্যালেন্স অপর্যাপ্ত', 'আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই।', 'error');
                return;
            }
            if (!number) {
                showModal('নম্বর দিন', 'অনুগ্রহ করে টাকা গ্রহণের মোবাইল নম্বর প্রদান করুন।', 'error');
                return;
            }

            // Deduct immediately & queue
            currentUser.balance -= amount;
            const uIndex = db.users.findIndex(u => u.phone === currentUser.phone);
            if (uIndex !== -1) db.users[uIndex] = currentUser;

            db.requests.push({
                id: Date.now(),
                type: 'Withdraw',
                userPhone: currentUser.phone,
                userName: currentUser.name,
                amount,
                method: selectedWthGateway,
                sender: number,
                trx: '-',
                status: 'Pending',
                date: new Date().toLocaleDateString('bn-BD')
            });
            saveDB(db);

            showModal('উইথড্র রিকোয়েস্ট জমা', `৳${amount} উত্তোলনের আবেদন গ্রহণ করা হয়েছে। ৩০ মিনিটের মধ্যে আপনার নাম্বারে পৌঁছে যাবে।`, 'success', () => {
                switchTab('dashboard');
            });
        }

        // ================= PROFILE =================
        function renderProfileView(db) {

                    <!-- Referral Details -->
                    <div class="bg-black/40 p-4 rounded-2xl border border-purple-500/30 text-left space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-white">আপনার রেফার কোড:</span>
                            <span class="text-xs font-mono font-bold text-purple-400 bg-purple-950/60 px-2 py-0.5 rounded border border-purple-500/30">${currentUser.referralCode}</span>
                        </div>
                        <p class="text-[10px] text-gray-400">যেকোনো মেম্বার আপনার রেফার কোড দিয়ে অ্যাকাউন্ট খুলে প্ল্যান কিনলে আপনি <strong class="text-emerald-400">৭% ইনস্ট্যান্ট কমিশন</strong> পাবেন।</p>

                    </div>

                    </button>
                </div>
            `;
        }

        function copyRefLink(link) {
            navigator.clipboard.writeText(link);
            showModal('কপি হয়েছে', 'আপনার ব্যক্তিগত রেফারেল লিংক কপি করা হয়েছে! বন্ধুদের সাথে শেয়ার করুন।', 'info');
        }

        // ================= SUPPORT CHAT =================
        function toggleSupportChat() {
            if(!currentUser) {
                showModal('লগইন প্রয়োজন', 'সাপোর্টে কথা বলতে দয়া করে প্রথমে লগইন বা রেজিস্ট্রেশন করুন।', 'error');
                return;
            }
            const modal = document.getElementById('supportChatModal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                renderChatMessages();
                document.getElementById('unreadChatBadge').classList.add('hidden');
            }
        }

        function renderChatMessages() {
            const db = getDB();
            const container = document.getElementById('chatMessages');
            const userMsgs = db.messages.filter(m => m.userPhone === currentUser.phone);

            if(userMsgs.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 text-[11px] py-10">কোনো আগের চ্যাট নেই। আপনার যেকোনো প্রশ্ন বা সমস্যার কথা এখানে লিখুন।</p>`;
                return;
            }

            container.innerHTML = userMsgs.map(m => {
                const isUser = m.sender === 'user';
                return `
                    <div class="flex flex-col ${isUser ? 'items-end' : 'items-start'}">
                        <div class="max-w-[80%] p-2.5 rounded-2xl text-[11px] leading-relaxed ${isUser ? 'bg-purple-600 text-white' : 'bg-gray-800 text-gray-200 border border-gray-700'}">
                            ${m.text}
                        </div>
                        <span class="text-[9px] text-gray-500 mt-0.5 px-1">${m.time || ''}</span>
                    </div>
                `;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        function sendUserMessage() {
            const input = document.getElementById('chatInputText');
            const text = input.value.trim();
            if(!text) return;

            const db = getDB();
            db.messages.push({
                id: Date.now(),
                userPhone: currentUser.phone,
                userName: currentUser.name,
                sender: 'user',
                text,
                time: new Date().toLocaleTimeString('bn-BD', {hour: '2-digit', minute:'2-digit'})
            });
            saveDB(db);
            input.value = '';
            renderChatMessages();
        }

        // Cross-tab sync via storage events
        window.addEventListener('storage', () => {
            checkAuth();
            renderView();
        });

        window.onload = () => {
            checkAuth();
            renderView();
        };
    </script>
